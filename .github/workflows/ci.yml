# Called once by release-smoke for the same commit; avoid duplicate full suites
# in two independently triggered workflows. The matrix comes from platforms.json.
name: rust-quality

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string

permissions:
  contents: read

jobs:
  rust-quality:
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.mine/build/ci/${{ github.job }}/quality-target
      CARGO_BUILD_JOBS: "2"
      RUSTDOCFLAGS: "-D warnings"
      RUST_TEST_THREADS: "1"
      NATIVE_BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Toolchain identity
        run: |
          rustc --version
          cargo --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings -W unsafe-code
      - run: cargo build --all-targets --all-features
      - run: cargo test --all-targets --all-features
      - run: cargo doc --no-deps --all-features
      - name: Actual Design and ADR validation
        run: |
          "$CARGO_TARGET_DIR/debug/$NATIVE_BINARY" design validate --format json
          "$CARGO_TARGET_DIR/debug/$NATIVE_BINARY" adr validate --format json
      - name: Validate only a fresh private native graph, never mutate bootstrap state
        run: |
          cargo test --locked --test release_delivery_contract --no-run --message-format=json > "$RUNNER_TEMP/quality-phase-build.jsonl"
          python scripts/test-install-delivery.py --preflight "$CARGO_TARGET_DIR/debug/$NATIVE_BINARY" --fixture-build "$RUNNER_TEMP/quality-phase-build.jsonl" --output "$RUNNER_TEMP/quality-phase-evidence"

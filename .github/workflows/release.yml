# Archive integrity is not build reproducibility. Native delivery runs on PRs
# and branches as well as tags; only the final publication job is tag-gated.
# Phase probes use only isolated, typed fixtures and the exact built candidate.
name: release-smoke

on:
  push:
    branches: [master, dev, "plan/**"]
    # ADR-0035: this one release uses the complete independently reviewed local join.
    tags: ["v*", "!v0.2.0"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/.mine/build/ci/${{ github.job }}/cargo-target
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"

jobs:
  platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: matrix
        run: echo "matrix=$(python scripts/test-install-delivery.py --matrix)" >> "$GITHUB_OUTPUT"

  quality:
    needs: platforms
    uses: ./.github/workflows/ci.yml
    with:
      matrix: ${{ needs.platforms.outputs.matrix }}

  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/sync-release-platforms.py --check
      - run: python scripts/sync-plugin-assets.py --check
      - run: python scripts/verify.py
      - name: Publication refusal counterexamples
        run: python scripts/test-install-delivery.py --contracts-only

  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile actual candidate and typed private fixture producer
        run: cargo test --locked --test release_delivery_contract --no-run --message-format=json > "$RUNNER_TEMP/phase-build.jsonl"
      - name: Isolated phase behavior probes (not this project's release permission)
        run: python scripts/test-install-delivery.py --preflight "$CARGO_TARGET_DIR/debug/mine" --fixture-build "$RUNNER_TEMP/phase-build.jsonl" --output "$RUNNER_TEMP/mine-phase-evidence"
      - name: Actual event candidate identity Design ADR and tag-only stable hygiene
        run: python scripts/test-install-delivery.py --candidate-check "$CARGO_TARGET_DIR/debug/mine" --ref "$GITHUB_REF" --output "$RUNNER_TEMP/mine-candidate-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: phase-preflight-evidence
          path: |
            ${{ runner.temp }}/mine-phase-evidence/phase-evidence.json
            ${{ runner.temp }}/mine-phase-evidence/phase-commands.json
            ${{ runner.temp }}/mine-candidate-evidence/candidate-evidence.json
          if-no-files-found: error

  mcp-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo build --locked
      - name: Actual initialization and schema discovery
        run: python scripts/test-install-delivery.py --mcp "$CARGO_TARGET_DIR/debug/mine" --output "$RUNNER_TEMP/mine-mcp-evidence"
      - name: CLI/MCP contract parity
        run: cargo test --test cli --test mcp
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-discovery-evidence
          path: |
            ${{ runner.temp }}/mine-mcp-evidence/stdout.jsonl
            ${{ runner.temp }}/mine-mcp-evidence/stderr.log
            ${{ runner.temp }}/mine-mcp-evidence/tools.json
            ${{ runner.temp }}/mine-mcp-evidence/discovery-evidence.json
          if-no-files-found: error

  native-delivery:
    needs: platforms
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build exact native release candidate
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$NATIVE_TARGET"
      - name: Package actual native executable and adjacent checksum
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_BINARY: ${{ matrix.binary }}
        run: python scripts/test-install-delivery.py --package "$CARGO_TARGET_DIR/$NATIVE_TARGET/release/$NATIVE_BINARY" --output "$RUNNER_TEMP/mine-delivery/assets"
      - name: Actual bootstrap checksum extraction version and refusals
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          NATIVE_BINARY: ${{ matrix.binary }}
          NATIVE_ARCHIVE: ${{ matrix.archive }}
        run: python scripts/test-install-delivery.py --binary "$CARGO_TARGET_DIR/$NATIVE_TARGET/release/$NATIVE_BINARY" --archive "$RUNNER_TEMP/mine-delivery/assets/$NATIVE_ARCHIVE" --output "$RUNNER_TEMP/mine-delivery/native"
      - name: Accepted native installer regressions
        run: cargo test --test install_delivery actual_native
      - name: Accepted update swap and refresh outcomes
        run: "cargo test --lib setup::"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifact-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/mine-delivery/assets
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.os }}-${{ matrix.arch }}
          # Retain bounded decisive logs/identities, not every disposable
          # fixture binary, installation tree and archive copy.
          path: |
            ${{ runner.temp }}/mine-delivery/package-evidence.json
            ${{ runner.temp }}/mine-delivery/native/native-evidence.json
            ${{ runner.temp }}/mine-delivery/native/*/stdout.log
            ${{ runner.temp }}/mine-delivery/native/*/stderr.log
            ${{ runner.temp }}/mine-delivery/native/*/requests.jsonl
            ${{ runner.temp }}/mine-delivery/native/*/refresh.stdout.json
            ${{ runner.temp }}/mine-delivery/native/*/refresh.stderr.log
          if-no-files-found: error

  release:
    needs: [quality, preflight, mcp-discovery, payload, native-delivery]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refuse failed skipped cancelled or missing mandatory jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/test-install-delivery.py --gate-needs "$NEEDS_JSON" --ref "$GITHUB_REF"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-artifact-*
          merge-multiple: true
          path: ${{ runner.temp }}/mine-publication
      - name: Verify complete canonical archive and checksum matrix
        run: python scripts/test-install-delivery.py --verify-assets "$RUNNER_TEMP/mine-publication"
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
      - name: Compose release body
        env:
          CHANGELOG: ${{ steps.cliff.outputs.content }}
        run: |
          printf '%s\n\n' "$CHANGELOG" > "$RUNNER_TEMP/RELEASE_BODY.md"
          cat .github/RELEASE_NOTES_TEMPLATE.md >> "$RUNNER_TEMP/RELEASE_BODY.md"
      - name: Publish only after all mandatory results and checksums
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/RELEASE_BODY.md
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/mine-publication/mine-*.tar.gz
            ${{ runner.temp }}/mine-publication/mine-*.zip
            ${{ runner.temp }}/mine-publication/mine-*.sha256
            ${{ runner.temp }}/mine-publication/SHA256SUMS.txt

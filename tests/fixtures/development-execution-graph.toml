rejection_reason = "Independent review REJECTED: (1) cargo test --all-targets --all-features genuinely fails on the submitted commit (application::release_service::tests::cleanup_preview_lists_design_backups), contradicting the implementation report's claimed 335/335 pass; reproduced deterministically in isolation at commit 929fef6. (2) Root cause is a real, load-bearing release-safety defect: branch_has_design_backups (the actual 'no design backups on stable' preflight gate, not merely the failing test's preview_cleanup) runs 'git ls-tree --name-only <branch>' WITHOUT -r and checks each line for a 'docs/design-backup-' prefix; independently reproduced in a disposable repository that a real, committed docs/design-backup-.../ directory produces exactly one non-recursive ls-tree line ('docs'), which can never match the prefix check. The gate can never detect a real design backup on master and would silently report safe. (3) Work Package 2 ('Implement release workflows, checksums, bootstrap, and installation smoke tests') was not implemented at all: .github/workflows/ is a declared exclusive write path, the pre-existing ci.yml explicitly says 'Release, bootstrap, and multi-platform artifact workflows are owned by Plan 08', and git diff/git log confirm zero changes to .github/workflows/ anywhere in the branch or the repository's entire history since the foundational CI commit. (4) Work Package 3 ('Create end-to-end fixtures for new repository, large old repository without design, stale managed design, legacy unmarked design conflict, protected design decision, and unscoped incomplete coverage') delivered fixtures/tests for only 2 of the 6 named scenarios; grep/find across tests/ and src/ confirm zero coverage of 'large old repository without design', 'stale managed design', 'protected design decision', or 'unscoped incomplete coverage' anywhere in the repository. None of these four defects are stable-branch mutations legitimately reserved for the independent reviewer; all are ordinary implementation-branch deliverables the plan's own text and declared scope committed to. See docs/plan/reports/08-release-bootstrap-mine-sync-and-self-hosting-review.md for full evidence and adversarial reproduction steps."

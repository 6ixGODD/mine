rejection_reason = "Independent review REJECTED: WP1 (recursive backup gate) and full test suite (348/348, twice, fresh CARGO_TARGET_DIR) and WP3 (all 6 fixtures) are genuinely fixed. WP2 (.github/workflows/release.yml) is decisively insufficient: (1) preflight job uses '|| true', can never fail; (2) mcp-discovery job redirects to /dev/null with '|| true' and never checks the 12-tool contract; (3) checksum-determinism check hashes the same unrebuilt binary twice (tautology) -- independently reproduced that a genuine rebuild produces a DIFFERENT hash, proving the real build is not reproducible and this check would never catch it; (4) no release-specific job (preflight/artifact/bootstrap/agent-install/mcp-discovery) runs on windows-latest or macos-latest, only quality does. See docs/plan/reports/08-1-release-safety-workflows-and-complete-e2e-review.md."
compensating_plan = "08-2"


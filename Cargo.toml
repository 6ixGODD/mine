[package]
name = "mine"
version = "0.1.13"
edition = "2024"
rust-version = "1.85"
description = "MINE Is Not Everyone's: deterministic engineering-workflow core for Claude Code, Codex, Pi, and OpenCode"
license = "MIT"
authors = ["BoChen SHEN"]
repository = "https://github.com/6ixGODD/mine-is-not-everyones"
publish = false

[lib]
name = "mine"
path = "src/lib.rs"

[[bin]]
name = "mine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
fs4 = "1.1.0"
serde_json = "1"
sha2 = "0.10"
schemars = { version = "1", features = ["preserve_order"] }
rmcp = { version = "2.2.0", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Comment/ordering-preserving TOML editing for the Codex agent
# installer config merge (avoids the destructive full-parse/reserialize
# round trip that drops comments and formatting).
toml_edit = "0.22"

# Interactive installer TUI (mine setup) and lightweight HTTP for self-update /
# release-asset download (sync, no async runtime overhead).
crossterm = "0.28"
ureq = { version = "3", features = ["json"] }
clap = { version = "4", features = ["derive", "color", "help"] }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "2.2.0", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
